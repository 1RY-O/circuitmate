# CircuitMate — Nginx fallback edge. Replace circuitmate.example.com, then:
#   sudo ln -s /etc/nginx/sites-available/circuitmate /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d circuitmate.example.com
#
# The browser connects to wss://agents.assemblyai.com directly, so this only
# proxies plain HTTP — no websocket upgrade directives required.

server {
    listen 80;
    server_name circuitmate.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name circuitmate.example.com;

    ssl_certificate     /etc/letsencrypt/live/circuitmate.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/circuitmate.example.com/privkey.pem;

    # Nginx drops bodies above this before they reach Node (app caps at 256KB).
    client_max_body_size 512k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}